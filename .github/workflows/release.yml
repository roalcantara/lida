name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    env:
      TARGET: ${{ matrix.target }}
      REF_NAME: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The channel comes from rust-toolchain.toml; only the cross target is added here.
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Build release binary
        run: cargo build --package lida --release --locked --target "$TARGET"

      - name: Package archive
        shell: bash
        run: |
          BIN_NAME="lida"
          PKG_NAME="lida-${REF_NAME}-${TARGET}"
          mkdir -p "dist/${PKG_NAME}"
          cp "target/${TARGET}/release/${BIN_NAME}" "dist/${PKG_NAME}/"
          cp README.md LICENSE "dist/${PKG_NAME}/"
          tar -czf "dist/${PKG_NAME}.tar.gz" -C dist "${PKG_NAME}"
          shasum -a 256 "dist/${PKG_NAME}.tar.gz" > "dist/${PKG_NAME}.tar.gz.sha256"

      # Each matrix job uploads its own archive; the first one to finish creates the release.
      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$REF_NAME" --verify-tag --generate-notes 2>/dev/null || gh release view "$REF_NAME" >/dev/null
          gh release upload "$REF_NAME" dist/*.tar.gz dist/*.sha256 --clobber
