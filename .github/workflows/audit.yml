name: Audit

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  audit:
    name: Slow and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MISE_LOCKED: "true"
      # Tools in mise.toml that no CI job runs: the code graphs, the bun they run on, and fnox (tools/graph/README.md).
      MISE_DISABLE_TOOLS: bun,github:zzet/gortex,pipx:code-review-graph,pipx:graphifyy,fnox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks scans the full history.
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          # Runs on release tags: no shared cache, so a poisoned one cannot reach a release check.
          cache: false

      - name: Audit
        run: mise run audit
