# Weekly dependency updates, one pull request per ecosystem. The prefixes keep them valid Conventional Commits that
# release nothing by themselves (docs/adr/0001-releases.md).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week before taking a new release: most bad releases are yanked or fixed within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
      day: monday
    # Wait a week before taking a new release: most bad releases are yanked or fixed within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ["*"]
